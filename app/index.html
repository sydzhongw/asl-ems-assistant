<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SignLink EMS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #0a1628; color: white; height: 100vh; overflow: hidden; }
  .screen { display: none; height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* HOME */
  #home { align-items: center; justify-content: center; text-align: center; }
  .logo { font-size: 60px; font-weight: 700; }
  .logo span { color: #2dd4bf; }
  .sub { color: #94a3b8; margin: 10px 0 40px; }
  .start { width: 180px; height: 180px; border-radius: 50%; background: #2dd4bf; border: none; color: #0a1628; font-size: 18px; font-weight: 600; cursor: pointer; }

  /* PICKER */
  #picker { align-items: center; justify-content: center; gap: 30px; }
  h2 { font-size: 32px; }
  .roles { display: flex; gap: 24px; }
  .role {
    width: 240px; height: 140px; background: #1e293b; border: 2px solid #334155;
    border-radius: 16px; color: white; font-size: 18px; cursor: pointer;
  }
  .role:hover { border-color: #2dd4bf; }

  /* PATIENT FACETIME */
  #patient { background: #000; }
  .ft-main {
    flex: 1; background: #111; display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #7dd3fc; position: relative;
  }
  .self {
    position: absolute; bottom: 90px; right: 16px; width: 120px; height: 160px;
    background: #222; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #aaa;
  }
  .ft-bar {
    height: 80px; background: #111; display: flex; align-items: center; justify-content: center; gap: 20px;
  }
  .circle { width: 52px; height: 52px; border-radius: 50%; background: #333; border: none; color: white; }
  .red { background: #e11d48; }

  /* EMS */
  #ems { background: #0a1628; }
  .ems-top { padding: 16px; background: #0f1c2e; }
  .ems-body { flex: 1; display: flex; padding: 16px; gap: 16px; }
  .cam { flex: 1; background: #1e293b; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #7dd3fc; }
  .text { width: 340px; background: #0f172a; border-radius: 12px; padding: 24px; }
  .big { font-size: 36px; font-weight: 700; margin-top: 12px; }
  .ems-bottom { padding: 16px; display: flex; justify-content: center; gap: 12px; background: #0f1c2e; }
  .btn { background: #1e293b; color: white; border: none; padding: 12px 20px; border-radius: 40px; cursor: pointer; }
</style>
</head>
<body>

<div id="home" class="screen active">
  <div class="logo">SignLink <span>EMS</span></div>
  <div class="sub">A communication aid for EMS and ASL-signing patients</div>
  <button class="start" onclick="go('picker')">Start Call</button>
</div>

<div id="picker" class="screen">
  <h2>Choose your role</h2>
  <div class="roles">
    <button class="role" onclick="go('patient')">I’m the Patient</button>
    <button class="role" onclick="go('ems')">I’m the EMS</button>
  </div>
</div>

<div id="patient" class="screen">
  <div class="ft-main" id="signer">
    AI Interpreter<br>Waiting...
    <div class="self">Your camera</div>
  </div>
  <div class="ft-bar">
    <button class="circle">Mute</button>
    <button class="circle red" onclick="go('home')">End</button>
    <button class="circle">Video</button>
  </div>
</div>

<div id="ems" class="screen">
  <div class="ems-top">SignLink EMS • Connected</div>
  <div class="ems-body">
    <div class="cam">Patient Camera</div>
    <div class="text">
      <div style="color:#2dd4bf;font-size:13px;">Patient signed</div>
      <div class="big" id="caption">Waiting...</div>
    </div>
  </div>
  <div class="ems-bottom">
    <button class="btn" onclick="next()">Ask next question</button>
    <button class="btn" onclick="go('picker')">Change role</button>
    <button class="btn" style="background:#e11d48" onclick="go('home')">End Call</button>
  </div>
</div>

<script>
function go(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
const q = ["Where does it hurt?", "Can you breathe okay?"];
const a = ["My chest hurts", "Yes"];
let i = 0;
function next() {
  document.getElementById('signer').innerHTML = "AI Interpreter<br>Signing: " + q[i % q.length] + '<div class="self">Your camera</div>';
  document.getElementById('caption').textContent = a[i % a.length];
  i++;
}
</script>
</body>
</html>
